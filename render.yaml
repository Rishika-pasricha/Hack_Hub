services:
  - type: web
    name: ecofy-backend
    env: node
    rootDir: backend
    buildCommand: npm install; pip install -r requirements-ml.txt
    startCommand: node app.js
    plan: free
    autoDeploy: true
    envVars:
      - key: MONGO_URI
      - key: PORT
        value: 8082
      - key: NODE_ENV
        value: production
      - key: PYTHON_BIN
        value: python
