services:
  - type: web
    name: ecofy-backend
    env: node
    rootDir: backend
    buildCommand: npm install; python -m pip install --upgrade pip; python -m pip install -r requirements-ml.txt
    startCommand: python -c "import numpy, PIL, tensorflow" || python -m pip install -r requirements-ml.txt; node app.js
    plan: free
    autoDeploy: true
    envVars:
      - key: MONGO_URI
      - key: PORT
        value: 8082
      - key: NODE_ENV
        value: production
      - key: PYTHON_BIN
        value: python
